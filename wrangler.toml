name = "eventsyncweb"
compatibility_date = "2026-11-07"
main = "./workers/index.ts"

# Vite outputs to dist/; SPA fallback serves index.html for client routes.
# /api/* hits the Worker first so Analyze AI works in production.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare Build settings must deploy the Worker script (not assets-only):
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
# After a successful Worker deploy, set the API key as a secret (not in this file):
#   npx wrangler secret put XAI_API_KEY

[vars]
XAI_MODEL = "grok-4.3"
# Client simulation timing (also set in .env.local for Vite builds; baked at build time).
SIMULATE_SECS = "10"
SIMULATE_LAPS = "8"

